services:
  auth:
    image: auth
    build:
      context: services
      dockerfile: auth.Dockerfile
    env_file:
      - ./services/apis/auth/.env.example
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command: ["node", "--inspect=0.0.0.0:9229", "server.js"]
