services:
  account-service:
    image:  account-service
    build:
      context: services
      dockerfile: accountService.Dockerfile
    env_file:
      - ./services/apis/account-service/.env
    environment:
      NODE_ENV: development
    ports:
      - 4000:4000
      - 9229:9229
    command: ["node", "--inspect=0.0.0.0:9229", "./apis/account-service/server.js"]
